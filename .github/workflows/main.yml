name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ThermalCore
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Checkout CoFHCore
        uses: actions/checkout@v4
        with:
          repository: Scorpiosmn/CoFHCore-1.21
          path: CoFHCore-1.21

      - name: Build CoFHCore
        run: |
          cd CoFHCore-1.21
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Manually install CoFHCore to local maven
        run: |
            cd CoFHCore-1.21
            M2_DIR=$HOME/.m2/repository/com/teamcofh/cofh_core/1.21.1-11.0.2
            mkdir -p $M2_DIR
    
            find . -name "cofh_core-*.jar" -path "*/libs/*" -exec cp {} $M2_DIR/ \;
    
            echo '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.teamcofh</groupId><artifactId>cofh_core</artifactId><version>1.21.1-11.0.2</version></project>' > $M2_DIR/cofh_core-1.21.1-11.0.2.pom
    
            ls -la $M2_DIR
      
      - name: Build ThermalCore
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error
