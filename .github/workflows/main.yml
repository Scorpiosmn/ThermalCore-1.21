name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ThermalCore
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Checkout CoFHCore
        uses: actions/checkout@v4
        with:
          repository: Scorpiosmn/CoFHCore-1.21
          path: CoFHCore-1.21

      - name: Build and publish CoFHCore to local maven
        run: |
          cd CoFHCore-1.21
          chmod +x ./gradlew
          ./gradlew publishToMacenLocal --no-daemon
      
      - name: Build ThermalCore
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-javadoc.jar
          if-no-files-found: error
